<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bg-glow" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#059669" stop-opacity="0"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <!-- Background with gradient -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Subtle glow -->
  <rect width="512" height="512" rx="96" fill="url(#bg-glow)"/>
  <!-- Wallet icon -->
  <g transform="translate(256,256)" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wallet body -->
    <rect x="-100" y="-70" width="200" height="140" rx="16"/>
    <!-- Wallet flap -->
    <path d="M-100,-30 Q0,-70 100,-30" stroke-width="14"/>
    <!-- Card silhouette in wallet -->
    <rect x="-55" y="-5" width="65" height="45" rx="6" fill="rgba(255,255,255,0.2)" stroke="none"/>
    <!-- Dollar sign -->
    <text x="-28" y="28" fill="white" font-family="system-ui" font-size="28" font-weight="bold" text-anchor="middle">$</text>
    <!-- Coin circle -->
    <circle cx="50" cy="18" r="25" stroke-width="10"/>
    <!-- Coin dollar sign -->
    <text x="50" y="25" fill="white" font-family="system-ui" font-size="24" font-weight="bold" text-anchor="middle">$</text>
  </g>
</svg>
